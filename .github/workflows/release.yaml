name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
permissions:
  attestations: write
  contents: write
  id-token: write
defaults:
  run:
    shell: bash --noprofile --norc -euxo pipefail {0}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version numbers
        run: |
          readonly tag="${GITHUB_REF#refs/tags/}"
          if ! [[ "$tag" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Specified tag is not a valid SemVer.' >&2
            exit 1
          fi

          manifest_version="$(jq --raw-output '.version' 'manifest.json')"
          package_version="$(jq --raw-output '.version' 'package.json')"
          if ! [[ "$tag" == "$manifest_version" && "$tag" == "$package_version" ]]; then
            echo 'Version numbers should match.' >&2
            exit 1
          fi

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/install_imagemagick_and_oxipng.sh

      - name: Restore npm cache if possible
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
      - run: |
          npm ci
          npm run build
      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            web-ext-artifacts/copy_markdown_link-*.*.*.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          readonly tag="${GITHUB_REF#refs/tags/}"
          gh release create \
            "$tag" --title="$tag" \
            --draft --fail-on-no-commits --generate-notes --verify-tag \
            -- web-ext-artifacts/copy_markdown_link-*.*.*.zip
